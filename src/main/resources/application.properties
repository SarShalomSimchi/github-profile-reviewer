# Shared HTTP execution
http.connect-timeout-seconds=10
http.max-attempts=2
http.initial-retry-delay-millis=1000

# GitHub API. GITHUB_TOKEN is optional for public repositories.
github.api-base-url=https://api.github.com
github.request-timeout-seconds=20
github.token=

# AI provider and Gemini API. GEMINI_API_KEY is required for real reviews.
ai.provider=gemini
ai.api-base-url=https://generativelanguage.googleapis.com/v1beta
ai.api-key=
ai.model=gemini-3.1-flash-lite
ai.request-timeout-seconds=60
ai.batch-size=5
ai.max-batch-characters=120000
ai.max-output-tokens-per-repository=220
ai.max-attempts-per-repository=2
ai.thinking-level=minimal
ai.max-concurrent-requests=1
ai.prompt-path=prompts/repository-review.txt

# Virtual-thread concurrency for GitHub README downloads.
processing.max-concurrency=8

# Generated HTML report directory.
report.output-directory=reports
